
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Крестики-нолики</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #10172b, #25204a);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.game {
    width: 100%;
    max-width: 430px;
    text-align: center;
}

h1 {
    font-size: 34px;
    margin-bottom: 10px;
}

.subtitle {
    color: #aeb4d0;
    margin-bottom: 25px;
}

.panel {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 18px;
}

.section-title {
    font-size: 14px;
    color: #aeb4d0;
    margin-bottom: 12px;
}

.buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 12px;
    padding: 13px 18px;
    font-size: 16px;
    font-weight: bold;
    transition: 0.2s;
}

button:active {
    transform: scale(0.96);
}

.mode-btn, .symbol-btn {
    background: #343b60;
    color: white;
    flex: 1;
}

.active {
    background: #7865ff !important;
    color: white;
}

.board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 22px 0;
}

.cell {
    aspect-ratio: 1;
    background: rgba(255,255,255,0.09);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    font-size: 55px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
}

.cell:disabled {
    cursor: default;
    opacity: 1;
}

.cell.x {
    color: #65d9ff;
}

.cell.o {
    color: #ff8bc4;
}

.cell.win {
    background: #397c67;
    border-color: #75f1b9;
}

.status {
    font-size: 19px;
    font-weight: bold;
    min-height: 28px;
    margin: 15px 0;
}

.score {
    display: flex;
    justify-content: space-around;
    gap: 10px;
}

.score-item {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 12px 5px;
}

.score-number {
    font-size: 25px;
    font-weight: bold;
    margin-top: 5px;
}

.new-game {
    width: 100%;
    background: linear-gradient(135deg, #7865ff, #a45dff);
    color: white;
    margin-top: 10px;
    padding: 16px;
}

.hint {
    color: #9da5c5;
    font-size: 12px;
    margin-top: 18px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="game">

    <h1>❌ Крестики-нолики ⭕</h1>
    <p class="subtitle">Проверь свою стратегию!</p>

    <div class="panel">
        <p class="section-title">ВЫБЕРИ РЕЖИМ</p>
        <div class="buttons">
            <button class="mode-btn active" id="computerMode">
                🤖 С компьютером
            </button>
            <button class="mode-btn" id="friendMode">
                👥 С другом
            </button>
        </div>
    </div>

    <div class="panel">
        <p class="section-title">ЗА КОГО ИГРАТЬ?</p>
        <div class="buttons">
            <button class="symbol-btn active" id="chooseX">❌ Крестик</button>
            <button class="symbol-btn" id="chooseO">⭕ Нолик</button>
        </div>
    </div>

    <div class="panel">

        <div class="status" id="status">Твой ход!</div>

        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <button class="new-game" id="newGame">
            🔄 Новая игра
        </button>
    </div>

    <div class="panel">
        <p class="section-title">СТАТИСТИКА</p>
        <div class="score">
            <div class="score-item">
                <div id="scoreX">❌</div>
                <div class="score-number" id="wins">0</div>
                <small id="winsLabel">Победы</small>
            </div>

            <div class="score-item">
                <div>🤝</div>
                <div class="score-number" id="draws">0</div>
                <small>Ничьи</small>
            </div>

            <div class="score-item">
                <div id="scoreO">⭕</div>
                <div class="score-number" id="losses">0</div>
                <small id="lossesLabel">Поражения</small>
            </div>
        </div>
    </div>

    <p class="hint">Игра работает без интернета</p>

</div>

<script>
const cells = [...document.querySelectorAll(".cell")];
const statusText = document.getElementById("status");

let board = Array(9).fill("");
let player = "X";
let computer = "O";
let currentPlayer = "X";
let mode = "computer";
let gameOver = false;

let wins = 0;
let losses = 0;
let draws = 0;

const winningLines = [
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
];

function getWinner(b) {
    for (const line of winningLines) {
        const [a, c, d] = line;

        if (b[a] && b[a] === b[c] && b[a] === b[d]) {
            return { symbol: b[a], line };
        }
    }

    return null;
}

function updateBoard() {
    cells.forEach((cell, i) => {
        cell.textContent =
            board[i] === "X" ? "❌" :
            board[i] === "O" ? "⭕" : "";

        cell.classList.toggle("x", board[i] === "X");
        cell.classList.toggle("o", board[i] === "O");

        cell.disabled = gameOver || board[i] !== "";
        cell.classList.remove("win");
    });
}

function finishGame() {
    const result = getWinner(board);

    if (result) {
        gameOver = true;

        result.line.forEach(i => {
            cells[i].classList.add("win");
        });

        if (mode === "friend") {
            statusText.textContent =
                "🏆 Победил " + (result.symbol === "X" ? "❌ Крестик!" : "⭕ Нолик!");
        } else if (result.symbol === player) {
            wins++;
            statusText.textContent = "🎉 Ты победил!";
        } else {
            losses++;
            statusText.textContent = "🤖 Компьютер победил!";
        }

        updateScore();
        updateBoard();
        return true;
    }

    if (board.every(cell => cell !== "")) {
        gameOver = true;
        draws++;
        statusText.textContent = "🤝 Ничья!";
        updateScore();
        updateBoard();
        return true;
    }

    return false;
}

function updateScore() {
    document.getElementById("wins").textContent = wins;
    document.getElementById("losses").textContent = losses;
    document.getElementById("draws").textContent = draws;
}

function makeMove(index) {
    if (gameOver || board[index] !== "") return;

    if (mode === "computer" && currentPlayer !== player) return;

    board[index] = currentPlayer;

    if (finishGame()) return;

    currentPlayer = currentPlayer === "X" ? "O" : "X";

    updateBoard();

    if (mode === "friend") {
        statusText.textContent =
            "Ход " + (currentPlayer === "X" ? "❌ Крестика" : "⭕ Нолика");
    } else {
        statusText.textContent = "Ход компьютера...";
        if (currentPlayer === computer) {
            setTimeout(computerMove, 350);
        }
    }
}

function computerMove() {
    if (gameOver || mode !== "computer") return;

    const move = findBestMove();

    if (move === -1) return;

    board[move] = computer;

    if (finishGame()) return;

    currentPlayer = player;
    statusText.textContent = "Твой ход!";
    updateBoard();
}

function findBestMove() {
    // 1. Победить, если есть возможность
    for (let i = 0; i < 9; i++) {
        if (!board[i]) {
            board[i] = computer;
            const won = getWinner(board);
            board[i] = "";

            if (won) return i;
        }
    }

    // 2. Заблокировать победу игрока
    for (let i = 0; i < 9; i++) {
        if (!board[i]) {
            board[i] = player;
            const danger = getWinner(board);
            board[i] = "";

            if (danger) return i;
        }
    }

    // 3. Занять центр
    if (!board[4]) return 4;

    // 4. Занять углы
    const corners = [0, 2, 6, 8].filter(i => !board[i]);
    if (corners.length) {
        return corners[Math.floor(Math.random() * corners.length)];
    }

    // 5. Занять любую свободную клетку
    const free = board
        .map((v, i) => v === "" ? i : -1)
        .filter(i => i !== -1);

    if (!free.length) return -1;

    return free[Math.floor(Math.random() * free.length)];
}

function resetGame() {
    board = Array(9).fill("");
    currentPlayer = "X";
    gameOver = false;

    cells.forEach(cell => {
        cell.classList.remove("win");
    });

    if (mode === "computer" && player === "O") {
        statusText.textContent = "Компьютер начинает...";
        updateBoard();
        setTimeout(computerMove, 350);
    } else {
        statusText.textContent =
            mode === "friend" ? "Ход ❌ Крестика" : "Твой ход!";
        updateBoard();
    }
}

function setMode(newMode) {
    mode = newMode;

    document.getElementById("computerMode")
        .classList.toggle("active", mode === "computer");

    document.getElementById("friendMode")
        .classList.toggle("active", mode === "friend");

    document.getElementById("chooseX").disabled = false;
    document.getElementById("chooseO").disabled = false;

    document.getElementById("winsLabel").textContent =
        mode === "computer" ? "Победы" : "Победы X";

    document.getElementById("lossesLabel").textContent =
        mode === "computer" ? "Поражения" : "Победы O";

    resetGame();
}

function setSymbol(symbol) {
    player = symbol;
    computer = symbol === "X" ? "O" : "X";

    document.getElementById("chooseX")
        .classList.toggle("active", symbol === "X");

    document.getElementById("chooseO")
        .classList.toggle("active", symbol === "O");

    document.getElementById("scoreX").textContent = "❌";
    document.getElementById("scoreO").textContent = "⭕";

    wins = 0;
    losses = 0;
    draws = 0;
    updateScore();

    resetGame();
}

cells.forEach(cell => {
    cell.addEventListener("click", () => {
        const index = Number(cell.dataset.index);
        makeMove(index);
    });
});

document.getElementById("computerMode").addEventListener("click", () => {
    setMode("computer");
});

document.getElementById("friendMode").addEventListener("click", () => {
    setMode("friend");
});

document.getElementById("chooseX").addEventListener("click", () => {
    setSymbol("X");
});

document.getElementById("chooseO").addEventListener("click", () => {
    setSymbol("O");
});

document.getElementById("newGame").addEventListener("click", resetGame);

// Запуск игры
updateBoard();
statusText.textContent = "Твой ход!";
</script>

</body>
</html>
